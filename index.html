<body>
<div id="app" style="max-width:420px;margin:0 auto;background:#f1f5f9;min-height:100vh;"></div>
<div id="print-area"></div>
<div id="share-area" style="position:fixed;left:-9999px;top:0;width:420px;background:#f1f5f9;padding:0;"></div>

<script>
const STORAGE_KEY = 'bp_records_v1';

// ── Utilities ──────────────────────────────────────────────────────
function toLocalDateStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(s) {
  const d = new Date(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function defaultEntry() {
  return {
    am: { readings: [{sys:'',dia:'',pulse:''},{sys:'',dia:'',pulse:''},{sys:'',dia:'',pulse:''}], time:'', memo:'' },
    pm: { readings: [{sys:'',dia:'',pulse:''},{sys:'',dia:'',pulse:''},{sys:'',dia:'',pulse:''}], time:'', memo:'' },
  };
}
function calcAvg(readings) {
  const valid = readings.filter(r => r.sys !== '' && r.dia !== '' && r.pulse !== '');
  if (!valid.length) return null;
  const n = valid.length;
  return {
    sys:   Math.round(valid.reduce((s,r) => s+Number(r.sys),0)/n),
    dia:   Math.round(valid.reduce((s,r) => s+Number(r.dia),0)/n),
    pulse: Math.round(valid.reduce((s,r) => s+Number(r.pulse),0)/n),
  };
}
// 収縮期が最も低い1回を返す
function calcBest(readings) {
  const valid = readings.filter(r => r.sys !== '' && r.dia !== '' && r.pulse !== '');
  if (!valid.length) return null;
  const best = valid.reduce((a,b) => Number(a.sys) <= Number(b.sys) ? a : b);
  return { sys: Number(best.sys), dia: Number(best.dia), pulse: Number(best.pulse) };
}
// 収縮期が最も高い1回を返す
function calcWorst(readings) {
  const valid = readings.filter(r => r.sys !== '' && r.dia !== '' && r.pulse !== '');
  if (!valid.length) return null;
  const worst = valid.reduce((a,b) => Number(a.sys) >= Number(b.sys) ? a : b);
  return { sys: Number(worst.sys), dia: Number(worst.dia), pulse: Number(worst.pulse) };
}
// 最良値と最悪値の平均（グラフ用）
function calcBestWorstAvg(readings) {
  const best = calcBest(readings);
  const worst = calcWorst(readings);
  if (!best || !worst) return best || worst || null;
  return {
    sys:   Math.round((best.sys   + worst.sys)   / 2),
    dia:   Math.round((best.dia   + worst.dia)   / 2),
    pulse: Math.round((best.pulse + worst.pulse) / 2),
  };
}
function statusOf(sys) {
  if (sys < 120) return { label:'正常',      color:'#22c55e' };
  if (sys < 130) return { label:'正常高値',   color:'#84cc16' };
  if (sys < 140) return { label:'高値血圧',   color:'#f59e0b' };
  return             { label:'高血圧',      color:'#ef4444' };
}
function loadRecords()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch(e){ return {}; } }
function saveRecords(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }

// ── State ──────────────────────────────────────────────────────────
let state = {
  tab: 'input',
  date: toLocalDateStr(),
  records: loadRecords(),
  chartMonth: (() => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; })(),
};

// ── Render helpers ─────────────────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'onclick') el.addEventListener('click', v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}
function svgEl(tag, attrs, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k,v);
  for (const c of children.flat()) { if(c) el.appendChild(c); }
  return el;
}

// ── Chart ──────────────────────────────────────────────────────────
function renderChart(records) {
  const pts = Object.entries(records)
    .sort(([a],[b])=>a.localeCompare(b)).slice(-30)
    .map(([date,entry]) => ({ date, amAvg:calcAvg(entry.am.readings), pmAvg:calcAvg(entry.pm.readings) }))
    .filter(p => p.amAvg || p.pmAvg);

  if (pts.length < 2) {
    return h('div',{style:{textAlign:'center',padding:'2rem',color:'#94a3b8',fontSize:'14px'}},
      'データが2日分以上あるとグラフが表示されます');
  }

  const W=340, H=200, PL=38, PT=8, PR=22, PB=22;
  const cW=W-PL-PR, cH=H-PT-PB;
  // Y軸固定 50〜170、10刻み
  const minV=50, maxV=170;
  const ticks=[50,60,70,80,90,100,110,120,130,140,150,160,170];
  const xS=i=>PL+(i/(pts.length-1))*cW;
  const yS=v=>PT+cH-((v-minV)/(maxV-minV))*cH;

  const makePath=(getter)=>{
    const vp=pts.map((p,i)=>({i,v:getter(p)})).filter(x=>x.v!=null);
    if(!vp.length) return '';
    return vp.map((x,j)=>`${j===0?'M':'L'}${xS(x.i).toFixed(1)},${yS(x.v).toFixed(1)}`).join(' ');
  };

  const svg = svgEl('svg',{viewBox:`0 0 ${W} ${H}`,style:'width:100%;overflow:visible'});

  // グリッド・Y軸ラベル
  ticks.forEach(t=>{
    const isKey = t===120||t===140;
    svg.appendChild(svgEl('line',{x1:PL,x2:PL+cW,y1:yS(t),y2:yS(t),
      stroke:isKey?'#e2e8f0':'#f1f5f9','stroke-width':'1'}));
    const tx=svgEl('text',{x:PL-4,y:yS(t)+4,'text-anchor':'end','font-size':'8',
      fill:isKey?'#64748b':'#94a3b8','font-weight':isKey?'bold':'normal'});
    tx.textContent=t; svg.appendChild(tx);
  });

  // 125 目標線（上・薄緑点線）
  svg.appendChild(svgEl('line',{x1:PL,x2:PL+cW,y1:yS(125),y2:yS(125),
    stroke:'#4ade80','stroke-width':'1.5','stroke-dasharray':'4,3'}));
  const lbl125=svgEl('text',{x:PL+cW+3,y:yS(125)+4,'font-size':'8',fill:'#16a34a','font-weight':'bold'});
  lbl125.textContent='125'; svg.appendChild(lbl125);

  // 75 目標線（下・薄青点線）
  svg.appendChild(svgEl('line',{x1:PL,x2:PL+cW,y1:yS(75),y2:yS(75),
    stroke:'#60a5fa','stroke-width':'1.5','stroke-dasharray':'4,3'}));
  const lbl75=svgEl('text',{x:PL+cW+3,y:yS(75)+4,'font-size':'8',fill:'#2563eb','font-weight':'bold'});
  lbl75.textContent='75'; svg.appendChild(lbl75);

  // データ線（収縮期・拡張期のみ）
  const lines=[
    [p=>p.amAvg?.sys, '#3b82f6','2',''],
    [p=>p.pmAvg?.sys, '#3b82f6','2','5,3'],
    [p=>p.amAvg?.dia, '#06b6d4','1.5',''],
    [p=>p.pmAvg?.dia, '#06b6d4','1.5','5,3'],
  ];
  lines.forEach(([g,c,w,d])=>{
    const p=makePath(g); if(!p) return;
    const a={'d':p,'stroke':c,'stroke-width':w,'fill':'none','stroke-linejoin':'round'};
    if(d) a['stroke-dasharray']=d;
    svg.appendChild(svgEl('path',a));
  });

  // X軸ラベル
  pts.forEach((p,i)=>{
    if(i!==0&&i!==pts.length-1&&i%Math.ceil(pts.length/4)!==0) return;
    const d=new Date(p.date);
    const t=svgEl('text',{x:xS(i),y:H-4,'text-anchor':'middle','font-size':'8',fill:'#94a3b8'});
    t.textContent=`${d.getMonth()+1}/${d.getDate()}`; svg.appendChild(t);
  });

  // 凡例（HTML）
  const mkL=(color,dash,label)=>{
    const ico=`<svg width="22" height="10" viewBox="0 0 22 10" style="flex-shrink:0;display:block"><line x1="0" y1="5" x2="22" y2="5" stroke="${color}" stroke-width="2"${dash?` stroke-dasharray="${dash}"`:''}></line></svg>`;
    const el=h('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'10px',color:'#475569',whiteSpace:'nowrap'}});
    el.innerHTML=ico; el.appendChild(document.createTextNode(label)); return el;
  };
  const mkRef=(color,dash,label)=>{
    const ico=`<svg width="22" height="10" viewBox="0 0 22 10" style="flex-shrink:0;display:block"><line x1="0" y1="5" x2="22" y2="5" stroke="${color}" stroke-width="1.5" stroke-dasharray="${dash}"></line></svg>`;
    const el=h('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'10px',color:'#475569',whiteSpace:'nowrap'}});
    el.innerHTML=ico; el.appendChild(document.createTextNode(label)); return el;
  };

  const legend=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px 10px',marginTop:'8px',padding:'8px 10px',background:'#f8fafc',borderRadius:'8px'}},
    mkL('#3b82f6','','収縮期（朝・実線）'),
    mkL('#3b82f6','5,3','収縮期（夜・点線）'),
    mkL('#06b6d4','','拡張期（朝・実線）'),
    mkL('#06b6d4','5,3','拡張期（夜・点線）'),
    mkRef('#4ade80','4,3','目標（上） 125'),
    mkRef('#60a5fa','4,3','目標（下） 75'),
  );

  const wrap=h('div',{}); wrap.appendChild(svg); wrap.appendChild(legend);
  return wrap;
}

// ── Monthly Table ──────────────────────────────────────────────────
function renderTable(records, ym) {
  const days=new Date(parseInt(ym.split('-')[0]),parseInt(ym.split('-')[1]),0).getDate();
  const th=(txt,left)=>h('th',{style:{padding:'6px 4px',borderBottom:'2px solid #e2e8f0',fontSize:'11px',color:'#64748b',textAlign:left?'left':'center',whiteSpace:'nowrap'}},txt);
  const thead=h('thead',{style:{background:'#f8fafc'}},
    h('tr',{},th('日',true),th('朝 上'),th('朝 下'),th('朝 脈'),th('夜 上'),th('夜 下'),th('夜 脈'))
  );
  const tbody=h('tbody',{});
  for(let i=1;i<=days;i++){
    const date=`${ym}-${String(i).padStart(2,'0')}`;
    const entry=records[date]||null;
    const amAvg=entry?calcAvg(entry.am.readings):null;
    const pmAvg=entry?calcAvg(entry.pm.readings):null;
    const status=amAvg?statusOf(amAvg.sys):null;
    const tdS={padding:'5px 4px',borderBottom:'1px solid #f1f5f9',fontSize:'12px',textAlign:'center'};
    const row=h('tr',{style:{background:i%2===0?'#fafafa':'white'}},
      h('td',{style:{...tdS,textAlign:'left',fontWeight:'600',color:status?.color||'#94a3b8'}},`${i}日`),
      h('td',{style:{...tdS,color:amAvg?statusOf(amAvg.sys).color:'#d1d5db',fontWeight:amAvg?'600':'400'}},amAvg?.sys??'—'),
      h('td',{style:tdS},amAvg?.dia??'—'),
      h('td',{style:{...tdS,color:'#f97316'}},amAvg?.pulse??'—'),
      h('td',{style:{...tdS,color:pmAvg?statusOf(pmAvg.sys).color:'#d1d5db',fontWeight:pmAvg?'600':'400'}},pmAvg?.sys??'—'),
      h('td',{style:tdS},pmAvg?.dia??'—'),
      h('td',{style:{...tdS,color:'#f97316'}},pmAvg?.pulse??'—'),
    );
    tbody.appendChild(row);
  }
  return h('div',{style:{overflowX:'auto'}},
    h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'12px'}},thead,tbody)
  );
}

// ── Reading Row ────────────────────────────────────────────────────
function renderReadingRow(idx, reading, onChange, period) {
  const currentVal = [reading.sys, reading.dia, reading.pulse].filter(v=>v!=='').join(' ');
  const filled = reading.sys !== '';

  const el = h('input',{
    type:'text', inputmode:'numeric',
    value: currentVal,
    placeholder:'例：120 80 72',
    style:{
      flex:'1', padding:'10px 12px',
      border:`1.5px solid ${filled?'#93c5fd':'#e2e8f0'}`,
      borderRadius:'10px', fontSize:'16px', fontFamily:'inherit',
      color:'#1e293b', background: filled?'#eff6ff':'#f8fafc',
      outline:'none', letterSpacing:'0.05em', minWidth:'0',
    }
  });

  el.addEventListener('focus', e => e.target.select());
  el.addEventListener('input', e => {
    const raw = e.target.value.replace(/[^0-9 ]/g,'');
    e.target.value = raw;
    const parts = raw.trim().split(/\s+/).filter(Boolean);
    onChange(idx, 'sys',   parts[0] ?? '');
    onChange(idx, 'dia',   parts[1] ?? '');
    onChange(idx, 'pulse', parts[2] ?? '');
  });
  el.addEventListener('blur', e => {
    const parts = e.target.value.trim().split(/\s+/).filter(Boolean);
    if (parts.length > 0) e.target.value = parts.join(' ');
  });

  const previewEl = h('div',{
    id: `preview-${period}-${idx}`,
    style:{
      display: filled?'flex':'none',
      marginTop:'2px', marginLeft:'36px', marginBottom:'4px',
      padding:'3px 10px', background:'#f0f9ff', borderRadius:'6px',
      alignItems:'center', gap:'2px', width:'fit-content',
    }
  },
    h('span',{'data-f':'sys', style:{color:'#3b82f6',fontWeight:'700',fontSize:'13px'}}, reading.sys||''),
    h('span',{style:{color:'#cbd5e1',fontSize:'12px'}},' / '),
    h('span',{'data-f':'dia', style:{color:'#475569',fontSize:'13px'}}, reading.dia||''),
    h('span',{style:{fontSize:'10px',color:'#94a3b8'}},' mmHg'),
    h('span',{'data-f':'pulse', style:{color:'#f97316',fontWeight:'600',fontSize:'13px',marginLeft:'8px'}}, reading.pulse||''),
    h('span',{style:{fontSize:'10px',color:'#94a3b8'}},' bpm'),
  );

  return h('div',{style:{marginBottom:'6px'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
      h('span',{style:{
        fontSize:'12px', fontWeight:'600',
        color: filled?'#3b82f6':'#94a3b8',
        width:'28px', textAlign:'right', flexShrink:'0',
      }},`${idx+1}回`),
      el,
    ),
    previewEl,
  );
}
